# Dirlock keystore
d /var/lib/dirlock 0711 root root - -
d /var/lib/dirlock/protectors 1777 root root - -
d /var/lib/dirlock/policies 1777 root root - -

# Temporary directory used by steamos-encrypt-home script
R! /home/dirlock.tmp

# Temporary fix for older policies and protectors
# '1000' is the uid/gid of the main ("deck") user
z /var/lib/dirlock/protectors/* - 1000 1000 - -
z /var/lib/dirlock/policies/* - 1000 1000 - -

# dirlock and its helper tools can create a temporary SDDM
# configuration file here. It has to survive the SDDM restarts that
# happen when a session ends, so it is removed on reboot instead.
r! /etc/sddm.conf.d/zz-steamos-dirlock.conf
