#
# pam_dirlock needs to read the home directory to know if the user
# must be authenticated by dirlock or not.
#
# Not knowing the answer results in SERVICE_ERR and makes the whole
# stack fail.
#
# It also needs access to the TPM in order to authenticate the user.

[Service]
ProtectHome=read-only
PrivateDevices=no
DeviceAllow=/dev/tpmrm0 rw
